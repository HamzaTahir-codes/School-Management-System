{% for field in form.hidden_fields %}
    {{ field }}
{% endfor %}

{% if form.non_field_errors %}
    <div class="mb-6 p-4 rounded-2xl bg-rose-50 border border-rose-100 text-rose-700 text-sm font-medium animate-shake">
        {% for error in form.non_field_errors %}
            <div class="flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                {{ error }}
            </div>
        {% endfor %}
    </div>
{% endif %}

<div class="premium-form-container grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-1">
    {% for field in form.visible_fields %}
        {% include 'includes/form_field.html' with field=field %}
    {% endfor %}
</div>
